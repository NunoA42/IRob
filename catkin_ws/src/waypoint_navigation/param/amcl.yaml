amcl:
  min_particles: 500
  max_particles: 2000
  update_min_d: 0.2
  update_min_a: 0.2
  resample_interval: 2
  laser_max_range: 3.5
  laser_min_range: 0.05
  laser_model_type: likelihood_field

  # Increase tolerance to sensor noise
  sigma_hit: 0.2
  z_hit: 0.8
  z_rand: 0.5

  # Loosen convergence thresholds
  d_thresh: 0.5        # distance before AMCL update
  a_thresh: 0.5        # angle before AMCL update

  # Increase odometry noise tolerance
  odom_alpha1: 0.5
  odom_alpha2: 0.5
  odom_alpha3: 0.5
  odom_alpha4: 0.5

  # Frame setup (usually default)
  base_frame_id: "base_footprint"
  odom_frame_id: "odom"
  global_frame_id: "map"
  save_pose_rate: 0.5
