controller_frequency: 10.0
planner_frequency: 1.0
conservative_reset_dist: 5.0

recovery_behavior_enabled: true
clearing_rotation_allowed: true

DWAPlannerROS:
  xy_goal_tolerance: 0.3
  yaw_goal_tolerance: 1

# Single, clean obstacle layer
obstacle_layer:
  enabled: true
  obstacle_range: 2.5           # max distance to detect obstacles
  raytrace_range: 3.0
  track_unknown_space: false    # don't treat unknown map cells as obstacles
  combination_method: 1
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    inf_is_valid: true
    obstacle_range: 2.5
    raytrace_range: 3.0

inflation_layer:
  enabled: true
  cost_scaling_factor: 3.0      # smoother gradient near obstacles
  inflation_radius: 0.15        # safer buffer around walls for TurtleBot3

static_layer:
  enabled: false
  
global_costmap:
  transform_tolerance: 0.5
local_costmap:
  transform_tolerance: 0.5
